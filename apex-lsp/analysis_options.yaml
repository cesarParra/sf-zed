include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Keep this as a simple skeleton project: treat warnings as warnings.
    # You can tighten this later as the server grows.
    todo: ignore

linter:
  rules:
    # Style / consistency
    - always_declare_return_types
    - prefer_single_quotes
    - require_trailing_commas

    # Correctness / safety
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures

    # Maintainability
    - avoid_unused_constructor_parameters
    - unnecessary_lambdas
