name: Dart

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Use the latest version of the SDK
      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        working-directory: apex-lsp
        run: dart pub get

      - name: Run build_runner
        working-directory: apex-lsp
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Tree-sitter library
        working-directory: apex-lsp
        run: |
          chmod +x tool/build_tree_sitter_lib.sh
          ./tool/build_tree_sitter_lib.sh

      - name: Analyze project source
        working-directory: apex-lsp
        run: dart analyze

      - name: Run tests
        working-directory: apex-lsp
        env:
          TS_SFAPEX_LIB: ${{ github.workspace }}/apex-lsp/libtree_sitter_sfapex.so
        run: dart test
